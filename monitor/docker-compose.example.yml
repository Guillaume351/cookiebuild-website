services:
  cookiebuild-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    environment:
      # Use the Docker service name when this sidecar is in the server compose.
      MINECRAFT_HOST: minecraft
      MINECRAFT_JAVA_PORT: "25565"
      MINECRAFT_BEDROCK_PORT: "19132"
      WEBSITE_URL: https://www.cookie-build.com
      DISCORD_PLAYER_STATUS_WEBHOOK_URL: ${DISCORD_PLAYER_STATUS_WEBHOOK_URL}
    volumes:
      - cookiebuild_monitor_state:/state
      - /home/ubuntu/Volumes/cookiebuild/papermc_data/logs:/minecraft-logs:ro

volumes:
  cookiebuild_monitor_state:
