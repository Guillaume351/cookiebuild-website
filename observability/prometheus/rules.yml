groups:
  - name: cookiebuild
    rules:
      - alert: CookieBuildMonitorStale
        expr: time() - cookiebuild_monitor_last_run_timestamp_seconds > 180
        for: 2m
        labels: { severity: critical, component: monitor }
        annotations:
          summary: Cookie Build monitor has stopped refreshing
          description: The external Java, Bedrock, website and database canary is stale.
      - alert: CookieBuildObservabilityTargetDown
        expr: up{job=~"prometheus|cookiebuild-monitor|node|cadvisor|postgres|sql-exporter|rabbitmq|alertmanager|loki|alloy"} == 0
        for: 5m
        labels: { severity: warning, component: observability }
        annotations:
          summary: Cookie Build observability target is down
          description: "{{ $labels.job }} / {{ $labels.instance }} has been unreachable for five minutes."
      - alert: CookieBuildDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: critical, component: host }
        annotations:
          summary: Cookie Build host disk is below 15 percent free
          description: World saves and backups are at risk if disk usage continues growing.
      - alert: CookieBuildMemoryLow
        expr: node_memory_MemAvailable_bytes < 2 * 1024 * 1024 * 1024
        for: 10m
        labels: { severity: warning, component: host }
        annotations:
          summary: Cookie Build host has less than 2 GiB available memory
          description: Check Minecraft heap, container memory and swap activity.
      - alert: CookieBuildHighMSPT
        expr: cookiebuild_minecraft_mspt > 50 and time() - cookiebuild_minecraft_mspt_observed_timestamp_seconds < 300 and cookiebuild_monitor_online_players{edition="java"} > 0
        for: 5m
        labels: { severity: warning, component: minecraft }
        annotations:
          summary: Cookie Build is running above 50 MSPT
          description: Gameplay is likely below 20 TPS while players are online.
      - alert: CookieBuildSevereTickDelay
        expr: (cookiebuild_minecraft_server_tick_delay_milliseconds > 1000 and time() - cookiebuild_minecraft_server_tick_delay_observed_timestamp_seconds < 120) and on() (cookiebuild_monitor_online_players{edition="java"} > 0)
        labels: { severity: warning, component: minecraft }
        annotations:
          summary: Cookie Build main thread stalled for more than one second
          description: "The latest measured scheduler delay exceeded one second while players were online. Inspect map preparation and slow-game-tick diagnostics."
      - alert: CookieBuildJoinFunnelStalled
        expr: sum(increase(cookiebuild_funnel_events_total{event="joined"}[1h])) >= 3 and (sum(increase(cookiebuild_funnel_events_total{event="queue_joined"}[1h])) or vector(0)) == 0
        for: 10m
        labels: { severity: warning, component: gameplay }
        annotations:
          summary: Players join Cookie Build but none reach a queue
          description: Inspect lobby readiness, selectors, NPC interaction and game availability.
      - alert: CookieBuildMatchFunnelStalled
        expr: ((cookiebuild_queue_ready_to_start == 1) and on(game) (cookiebuild_queue_eligible_players >= cookiebuild_queue_minimum_players) and on(game) (cookiebuild_queue_oldest_wait_seconds > 90) and on(game) (time() - cookiebuild_queue_state_observed_timestamp_seconds < 45)) and on() (max_over_time(cookiebuild_monitor_maintenance[15m]) == 0)
        for: 2m
        labels: { severity: warning, component: gameplay }
        annotations:
          summary: Cookie Build match-ready queue is stalled
          description: "{{ $labels.game }} has enough eligible players and a valid team composition, but its oldest player has waited over 90 seconds. Inspect countdowns, admission and map loading."
      - alert: CookieBuildClientVersionRejections
        expr: (sum by (source, edition, direction, client_version, protocol) (increase(cookiebuild_client_version_connections_total{result="rejected"}[1h])) > 0) and on() (cookiebuild_monitor_maintenance == 0)
        labels: { severity: warning, component: minecraft }
        annotations:
          summary: Cookie Build is rejecting incompatible client versions
          description: "A {{ $labels.edition }} attempt was rejected for an incompatible version (direction={{ $labels.direction }}, client_version={{ $labels.client_version }}, protocol={{ $labels.protocol }}). Check current Paper/Geyser/ViaVersion coverage before changing versions. Repeated attempts are grouped by Alertmanager."
      - alert: CookieBuildSkyblockStorageInvariantViolation
        expr: sum(cookiebuild_skyblock_storage_invariant_violations) > 0
        for: 10m
        labels: { severity: critical, component: skyblock-economy }
        annotations:
          summary: Skyblock storage accounting invariant is broken
          description: "At least one aggregate storage invariant has remained non-zero for ten minutes. Inspect quantity, reservation, listing reservation and capacity consistency before allowing further market writes."
      - alert: CookieBuildSkyblockExpiredListingsStuck
        expr: cookiebuild_skyblock_expired_active_listings > 0
        for: 15m
        labels: { severity: warning, component: skyblock-market }
        annotations:
          summary: Expired Skyblock listings remain active
          description: "One or more market listings are still active after expiry. Check the bounded expiry maintenance batch and reserved inventory release."
      - alert: CookieBuildSkyblockOrphanSessions
        expr: cookiebuild_skyblock_orphan_sessions > 0
        for: 15m
        labels: { severity: warning, component: skyblock-retention }
        annotations:
          summary: Skyblock sessions exceeded the twelve-hour safety bound
          description: "At least one open Skyblock session is older than twelve hours. Reconcile session shutdown/quit handling before using affected rows for retention."
      - alert: CookieBuildSkyblockMonetaryDrift
        expr: cookiebuild_skyblock_ledger_balance_drift_coins > 0 or cookiebuild_skyblock_ledger_version_drift_accounts > 0
        for: 10m
        labels: { severity: critical, component: skyblock-economy }
        annotations:
          summary: Skyblock bank balances drifted from their ledger
          description: "An island balance no longer matches its latest ledger balance or account version. Market transfers are intentionally excluded from faucet/sink totals, but every bank mutation must remain journaled."
