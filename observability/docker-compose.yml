services:
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/config/prometheus:/etc/prometheus:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/data/prometheus:/prometheus
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.50", memory: 768M }
        reservations: { memory: 128M }

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/config/alertmanager:/etc/alertmanager:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/data/alertmanager:/alertmanager
      - /home/ubuntu/Volumes/cookiebuild/observability/secrets/discord_webhook:/run/secrets/discord_webhook:ro
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.10", memory: 128M }
        reservations: { memory: 32M }

  grafana:
    image: grafana/grafana:13.1.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GRAFANA_DB_PASSWORD="$$(cat /run/secrets/grafana_db_password)"
        exec /run.sh
    environment:
      GF_SERVER_DOMAIN: metrics.cookie-build.com
      GF_SERVER_ROOT_URL: https://metrics.cookie-build.com
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cookiebuild.json
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/data/grafana:/var/lib/grafana
      - /home/ubuntu/Volumes/cookiebuild/observability/secrets/grafana_db_password:/run/secrets/grafana_db_password:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.30", memory: 384M }
        reservations: { memory: 64M }

  loki:
    image: grafana/loki:3.7.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/config/loki:/etc/loki:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/data/loki:/loki
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.30", memory: 512M }
        reservations: { memory: 64M }

  alloy:
    image: grafana/alloy:v1.17.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/config/alloy:/etc/alloy:ro
      - /home/ubuntu/Volumes/cookiebuild/observability/data/alloy:/var/lib/alloy/data
      - /home/ubuntu/Volumes/cookiebuild/papermc_data/logs:/minecraft-logs:ro
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.20", memory: 192M }
        reservations: { memory: 32M }

  node-exporter:
    image: prom/node-exporter:v1.12.0
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes:
      - /:/host:ro,rslave
    networks: [cookiebuild]
    deploy:
      mode: global
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.10", memory: 96M }
        reservations: { memory: 16M }

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=1m
      - --disable_metrics=app,cpuLoad,disk,diskIO,network,oom_event,percpu,perf_event,pressure
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.swarm.service.name
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [cookiebuild]
    deploy:
      mode: global
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.25", memory: 512M }
        reservations: { memory: 32M }

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_URI: postgres:5432/cookiebuild_prod?sslmode=disable
      DATA_SOURCE_USER: cookiebuild_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    volumes:
      - /home/ubuntu/Volumes/cookiebuild/observability/secrets/postgres_exporter_password:/run/secrets/postgres_exporter_password:ro
    networks: [cookiebuild]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.10", memory: 96M }
        reservations: { memory: 16M }

networks:
  cookiebuild:
    external: true
    name: cookie-build-server-428453_default
