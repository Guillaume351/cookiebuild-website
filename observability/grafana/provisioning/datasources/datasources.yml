apiVersion: 1
prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Cookie Build aggregate usage
    uid: cookiebuild-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: cookiebuild_metrics
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: cookiebuild_prod
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
